# Every test: unit tests, type check + build, and the end-to-end tests on an
# emulated iPhone (WebKit) and Pixel (Chromium).
# Not run directly. pr-tests.yml (pull requests) and deploy.yml (before
# publishing) both call it, so the list of checks lives in one place.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # includes the type check

      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
